<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2a5c">
  <title>Bandera 5.13</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="barra">
    <div class="titulo">
      <img src="icons/icon-192.png" alt="" width="36" height="36">
      <div>
        <h1>Bandera de Seguridad</h1>
        <small>Regla 5.13 · Colocación y retiro</small>
      </div>
    </div>
    <div class="acciones-barra">
      <button id="btnInstalar" class="btn-chico" hidden>Instalar</button>
      <button id="btnSalir" class="btn-salir" hidden>Salir</button>
    </div>
  </header>

  <section id="vista-login" class="login" hidden>
    <form id="formLogin" class="tarjeta">
      <h2>Inicia sesión con tu usuario de Shop Car</h2>
      <p class="nota">Tus reportes de colocación y retiro se envían a Shop Car a tu nombre.</p>
      <label>Usuario
        <input id="lUsuario" required autocomplete="username" autocapitalize="none" placeholder="usuario o correo">
      </label>
      <label>Contraseña
        <input id="lPassword" type="password" required autocomplete="current-password">
      </label>
      <button class="btn-prim" type="submit" id="btnEntrar">Entrar</button>
      <p id="loginError" class="error" hidden></p>
    </form>
  </section>

  <button id="estadoEnvio" class="estado-envio" type="button" hidden></button>

  <nav class="pestanas">
    <button data-vista="activas" class="activa">Colocadas <span id="numActivas" class="burbuja">0</span></button>
    <button data-vista="historial">Historial</button>
  </nav>

  <main>
    <section id="vista-activas" class="vista">
      <button id="btnColocar" class="btn-grande">
        <span class="icono">⚑</span> Colocar bandera
      </button>
      <div id="listaActivas"></div>
    </section>

    <section id="vista-historial" class="vista" hidden>
      <div class="filtros">
        <label>Desde <input type="date" id="fDesde"></label>
        <label>Hasta <input type="date" id="fHasta"></label>
      </div>
      <div id="resumen" class="resumen"></div>
      <div class="acciones-fila">
        <button id="btnCsv" class="btn-sec">Exportar a Excel (CSV)</button>
      </div>
      <div id="listaHistorial"></div>
    </section>

  </main>

  <!-- Captura de colocación / retiro -->
  <dialog id="dlgCaptura">
    <form id="formCaptura" method="dialog">
      <h2 id="capTitulo">Colocar bandera</h2>
      <div id="capDatos">
        <label>Localidad donde se coloca la bandera
          <select id="cLocalidad" required><option value="">Elige la localidad…</option></select>
        </label>
        <label>Vía
          <input id="cVia" required placeholder="Ej. Vía 3" list="viasUsadas" autocomplete="off">
          <datalist id="viasUsadas"></datalist>
        </label>
        <label>Equipo protegido
          <input id="cEquipo" placeholder="Opcional. Ej. carro GMX 12345" autocomplete="off">
        </label>
        <label>¿Quién colocó la bandera?
          <input id="cColoco" required placeholder="Nombre de quien la colocó" list="personasUsadas" autocomplete="off">
          <datalist id="personasUsadas"></datalist>
        </label>
        <label>Observaciones
          <textarea id="cObs" rows="2" placeholder="Opcional"></textarea>
        </label>
        <p class="nota">La fecha, la hora y la ubicación GPS se agregan solas a la foto.</p>
      </div>
      <div id="capBloqueo" class="bloqueo" hidden>
        <p id="bloqueoTexto"></p>
        <div id="bloqueoRetirar"></div>
        <label>Si no se retiró, indica el motivo
          <textarea id="bMotivo" rows="2" placeholder="Ej. el turno anterior no la retiró / se perdió la bandera"></textarea>
        </label>
        <button type="button" id="btnCerrarSinRetiro" class="btn-sec">Cerrar sin retiro y continuar</button>
      </div>
      <div id="capResumen" class="resumen-retiro" hidden></div>

      <label class="btn-foto" id="lblFoto">
        <span>📷 Tomar foto</span>
        <input type="file" id="cFoto" accept="image/*" capture="environment" hidden>
      </label>
      <p id="capEstado" class="nota"></p>
      <img id="capVista" alt="Vista previa con marca de agua" hidden>

      <div class="acciones-fila fin">
        <button type="button" id="btnCancelar" class="btn-sec">Cancelar</button>
        <button type="button" id="btnGuardar" class="btn-prim" disabled>Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Visor de fotos -->
  <dialog id="dlgFoto" class="visor">
    <img id="visorImg" alt="Foto del reporte">
    <div class="acciones-fila fin">
      <button id="btnCompartir" class="btn-sec">Compartir</button>
      <button id="btnDescargar" class="btn-sec">Descargar</button>
      <button id="btnCerrarFoto" class="btn-prim">Cerrar</button>
    </div>
  </dialog>

  <div id="aviso" class="aviso" hidden></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
